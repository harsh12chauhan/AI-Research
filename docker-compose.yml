
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-research-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: ai_research
      POSTGRES_PASSWORD: ai_research

    ports:
      - "5442:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_research -d ai_research"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
